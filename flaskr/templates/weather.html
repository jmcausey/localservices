{% extends 'base.html' %}
<head>
<meta http-equiv="refresh" content="900">
</head>
{% block content %}


<nav class="navbar mb-4">
  <div class="nav-left">
    <h1>Weather</h1>
  </div>
  <div class="nav-right">
    <a href="{{ url_for('weather.weather') }}" class="btn btn-outline-primary btn-sm rounded-pill shadow-sm px-3">
      <i class="bi bi-geo-alt-fill me-1"></i>Location
    </a>
  </div>
</nav>

<form method="GET" action="{{ url_for('weather.weather') }}" class="row g-3 mb-4">
  <div class="col-auto">
    <label for="city" class="visually-hidden">City</label>
    <select name="city" id="city" class="form-select">
      <option value="">All Cities</option>
      {% for c in cities %}
        <option value="{{ c }}" {% if selected_city == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">Filter</button>
  </div>
</form>

{% if table %}
<div class="table-responsive table-striped-wrapper">
  {{ table | safe }}
</div>
{% else %}
<p>No weather data available yet. Go to <a href="{{ url_for('index') }}">Home</a> to add some!</p>
{% endif %}
{% endblock %}
